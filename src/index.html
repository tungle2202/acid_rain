<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acid Rain Environmental Simulation</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Left: Simulation Canvas -->
      <section class="simulation-container">
        <canvas id="sim-canvas"></canvas>
      </section>

      <!-- Right: Control Panel Sidebar -->
      <aside class="control-panel">
        <header class="panel-header">
          <h1>Acid Rain Sim</h1>
          <span class="badge">v0.1.0</span>
        </header>

        <div class="panel-section">
          <h2>System Status</h2>
          <div class="status-item">
            <span class="status-dot online"></span>
            <span id="status-text">Vite Frontend Connected</span>
          </div>
        </div>

        <div class="panel-section">
          <h2>Environment Controls</h2>
          <div class="control-group">
            <label for="rain-intensity">Rain Intensity</label>
            <input type="range" id="rain-intensity" min="0" max="100" value="50" />
          </div>
          <div class="control-group">
            <label for="so2-emissions">SO₂ Emissions</label>
            <input type="range" id="so2-emissions" min="0" max="100" value="30" />
          </div>
          <div class="control-group">
            <label for="nox-emissions">NOₓ Emissions</label>
            <input type="range" id="nox-emissions" min="0" max="100" value="25" />
          </div>
        </div>

        <div class="panel-section">
          <h2>Metrics</h2>
          <div class="metrics-grid">
            <div class="metric-card">
              <span class="metric-label">Rain pH</span>
              <span class="metric-value" id="ph-metric">5.6</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Soil Acidity</span>
              <span class="metric-value" id="soil-metric">6.5</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
